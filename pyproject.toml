[project]
name = "truck-warehouse-optimization"
version = "0.1.0"
description = "Warehouse network optimization with LangGraph."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core",
    "mistralai",
    "pydantic>=2",
    "httpx",
    "dotenv",
    "ortools>=9.15",
    "pyyaml",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff", "mypy", "pylint", "pytest", "types-pyyaml"]

[tool.ruff]
line-length = 80
extend-exclude = ["agentic_tools/model/generated_model.py"]

[tool.ruff.lint.per-file-ignores]
"**/[A-Z]*.py" = ["N999"]

[tool.pylint.format]
max-line-length = 80

[tool.pylint.basic]
module-naming-style = "any"

[tool.pylint.design]
max-args = 6
max-positional-arguments = 6

[tool.pylint.typecheck]
generated-members = ["linear_solver_pb2.*"]

[tool.pylint.main]
ignore = ["generated_model.py"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = ["agentic_tools/model/generated_model\\.py"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
